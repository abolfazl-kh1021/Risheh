# =============================================================================
# Risheh — CI/CD
#
# Job 1 (quality): install → prisma generate + local SQLite schema → lint → build
# Job 2 (docker):  multi-stage image build → container smoke test →
#                  publish to GHCR on pushes to main
#
# Note: the build is executed in CI because the dev sandbox cannot run
# `next build` (dev server owns the port). A green CI = a verified production
# build, which the handoff docs flag as a required pre-deploy step.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2.23"

jobs:
  quality:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma — generate client & create local SQLite schema
        run: |
          mkdir -p "$RUNNER_TEMP/risheh-db"
          bunx prisma generate
          DATABASE_URL="file:$RUNNER_TEMP/risheh-db/ci.db" bunx prisma db push --accept-data-loss

      - name: Lint
        run: bun run lint

      - name: Build (production)
        env:
          DATABASE_URL: file:${{ runner.temp }}/risheh-db/ci.db
          AUTH_SECRET: ci-dummy-secret
        run: bun run build

  docker:
    name: Docker image & smoke test
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: risheh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot + /api/health)
        run: |
          docker run -d --name risheh -p 3000:3000 -e AUTH_SECRET=smoke-secret risheh:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"ok":true'; then
              echo "✅ container healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ container failed health check"
          docker logs risheh
          exit 1

      - name: Compute lowercase GHCR image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
