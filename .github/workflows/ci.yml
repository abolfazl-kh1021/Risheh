name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: risheh_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/risheh_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/risheh_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/risheh_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (0 errors required)
        run: bun run lint

      - name: Typecheck (no emit)
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run tests/unit

      - name: Integration tests (real Postgres)
        run: bunx vitest run tests/integration

      - name: Build (typecheck enforced via next.config)
        run: bun run build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results/
            .next/trace
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: risheh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/risheh
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/risheh
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply schema
        run: bunx prisma db push --skip-generate --accept-data-loss

      - name: Seed demo data
        run: bun prisma/seed.ts

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E journeys
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Dependency audit (report, non-blocking)
        run: bun audit --background-checks || true
