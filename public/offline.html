<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d3a" />
  <title>آفلاین | ریشه</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: #fff8f0 radial-gradient(#efe7da 0.75px, transparent 0.75px) 0 0 / 28px 28px;
      font-family: Vazirmatn, Tahoma, sans-serif; color: #1e1b14; text-align: center;
    }
    .card {
      max-width: 360px; width: 100%; background: #fff; border-radius: 24px; padding: 32px 24px;
      box-shadow: 0 12px 32px -4px rgba(43,33,24,.12); border: 1px solid #ebddc9;
    }
    img { width: 96px; height: auto; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; font-size: 20px; color: #002624; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.9; color: #404847; }
    button {
      font: inherit; font-weight: 700; border: 0; cursor: pointer; color: #fff; width: 100%;
      min-height: 48px; border-radius: 14px; background: linear-gradient(270deg, #0f3d3a, #002624);
    }
    .dot { color: #d89e3d; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/img/logo-mark.webp" alt="ریشه" />
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p><span class="dot">✦</span> اینترنت شما قطع است. پس از اتصال دوباره، گنجینه‌ی دست‌سازه‌های ایران در دسترس شما خواهد بود.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
