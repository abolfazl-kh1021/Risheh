# Live-reload development:   docker compose -f docker-compose.dev.yml up --build
# Open http://localhost:3000 — edit files in this folder, changes appear instantly.
name: risheh-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/db/custom.db
      AUTH_SECRET: dev-secret
      NEXT_TELEMETRY_DISABLED: "1"
      # Windows/macOS bind mounts don't send file events -> use polling
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app                          # your source code (live)
      - node_modules:/app/node_modules  # Linux deps, kept inside Docker
      - next_cache:/app/.next
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npx prisma generate &&
             mkdir -p db &&
             if [ ! -f db/custom.db ]; then npx prisma db push --accept-data-loss && bun prisma/seed.ts; fi &&
             npx next dev -p 3000 -H 0.0.0.0"

volumes:
  node_modules:
  next_cache:
