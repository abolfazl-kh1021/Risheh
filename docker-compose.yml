# =============================================================================
# Risheh — local production-style deployment (PostgreSQL edition)
#
#   docker compose up -d --build     → http://localhost:3000
#
# The web container connects to the `db` Postgres 16 service below. On first
# boot the entrypoint applies Prisma migrations and seeds the demo dataset
# (8 users, 58 artworks; demo password: risheh1403). Data persists in the
# `risheh-pg` named volume — delete it for a factory reset:
#
#   docker compose down -v
#
# To run the web container against Neon instead of the local db service,
# set DATABASE_URL/DIRECT_DATABASE_URL in the `web.environment` block
# (pooled + direct strings from the Neon dashboard) and remove `depends_on`.
# =============================================================================
name: risheh

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: risheh:local
    ports:
      - "3000:3000"
    environment:
      # Session-cookie signing secret. Set a real one for any serious use:
      #   AUTH_SECRET=$(openssl rand -hex 32) docker compose up -d
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      # Runtime (Prisma Client) connection — direct inside the compose network.
      DATABASE_URL: postgresql://risheh:${POSTGRES_PASSWORD:-risheh_local_pw}@db:5432/risheh?sslmode=disable&connection_limit=10&pool_timeout=20&connect_timeout=15
      # CLI/migrations connection (migrate deploy in the entrypoint).
      DIRECT_DATABASE_URL: postgresql://risheh:${POSTGRES_PASSWORD:-risheh_local_pw}@db:5432/risheh?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risheh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risheh_local_pw}
      POSTGRES_DB: risheh
      # Performance defaults tuned for a small self-hosted marketplace
      # (see docs/DEPLOY-POSTGRES-FA.md for tuning notes).
    command:
      [
        "postgres",
        "-c", "max_connections=100",
        "-c", "shared_buffers=256MB",
        "-c", "effective_cache_size=768MB",
        "-c", "work_mem=8MB",
        "-c", "maintenance_work_mem=128MB",
        "-c", "wal_compression=on",
      ]
    volumes:
      - risheh-pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risheh -d risheh"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  risheh-pg:
